
name: .NET Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore dotnet-app.Tests/ProjectFile-Tests.csproj

      - name: Build
        run: dotnet build dotnet-app.Tests/ProjectFile-Tests.csproj --no-restore

      - name: Run tests
        run: dotnet test dotnet-app.Tests/ProjectFile-Tests.csproj --no-build --logger "trx;LogFileName=test-results.trx"
