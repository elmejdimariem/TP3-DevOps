
name: Automated Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python Tests and Generate XML Report
        run: |
          cd python-app
          pip install unittest-xml-reporting
          python test_math_utils.py

      - name: Upload Python Test Report
        uses: actions/upload-artifact@v4
        with:
          name: python-test-report
          path: python-app/test-reports

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore dotnet-app.Tests/ProjectFile-Tests.csproj

      - name: Build
        run: dotnet build dotnet-app.Tests/ProjectFile-Tests.csproj --no-restore

      - name: Run tests
        run: dotnet test dotnet-app.Tests/ProjectFile-Tests.csproj --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload .NET Test Report
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-report
          path: dotnet-app.Tests/TestResults/test-results.trx
